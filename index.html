<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M&A Deals Platform</title>
    <script type="module" crossorigin src="/deals-platform/assets/index-DgyoAbrf.js"></script>
    <link rel="stylesheet" crossorigin href="/deals-platform/assets/index-BntZTae9.css">
  </head>
  <body class="overflow-x-hidden">
    <div class="w-full min-h-screen flex flex-col lg:flex-row">
      <!-- ASIDE -->
      <aside class="w-full lg:w-1/2 bg-gray-100 px-8 pr-0 lg:pr-28">
        <div class="max-w-lg m-auto ml-0 lg:ml-30 mt-10 lg:mt-22">
          <header>
            <!-- LOGO -->
            <div class="mb-14 lg:mb-58">
              <img src="logo.png" alt="" />
            </div>
          </header>

          <!-- HERO -->
          <section>
            <h1
              class="font-bold text-5xl sm:text-7xl xs:text-6xl mb-8 lg:mb-18 text-gradient-midnight pb-2"
            >
              Start Selling Today!
            </h1>
            <p class="font-bold leading-6 mb-12 lg:mb-0">
              Your first listing is almost ready. Just a few more steps, and
              you’ll be on your way to reaching buyers.
            </p>
          </section>
        </div>
      </aside>

      <!-- FORM -->
      <main class="w-full lg:w-1/2 bg-white">
        <div
          x-data="{
            shake() {
              this.$refs.box.classList.add('animate-shake');
              setTimeout(() => {
                this.$refs.box.classList.remove('animate-shake');
              }, 400);
            }
          }"
          x-ref="box"
          class="-ml-0 lg:-ml-20 bg-white shadow-deep-blue mt-0 lg:mt-16 mb-0 lg:mb-16 rounded-l-0 lg:rounded-l-[50px] px-8"
        >
          <div class="m-auto max-w-lg py-[50px]">
            <!-- FORM PROGRESS -->
            <div class="mb-8 flex items-center gap-x-3">
              <div
                @click="shake()"
                class="outline-2 outline-teal-700 rounded-full bg-white w-2.5 h-2.5 shrink-0 cursor-pointer"
              ></div>
              <div class="hidden xs:block bg-gray-200 w-full h-[1.5px]"></div>
              <div
                @click="shake()"
                class="rounded-full bg-gray-200 w-2.5 h-2.5 shrink-0 cursor-pointer"
              ></div>
              <div class="hidden xs:block bg-gray-200 w-full h-[1.5px]"></div>
              <div
                @click="shake()"
                class="rounded-full bg-gray-200 w-2.5 h-2.5 shrink-0 cursor-pointer"
              ></div>
              <div class="hidden xs:block bg-gray-200 w-full h-[1.5px]"></div>
              <div
                @click="shake()"
                class="flex place-items-center w-6 h-6 shrink-0 cursor-pointer"
              >
                <img src="checkmark.svg" alt="" />
              </div>
            </div>

            <section x-data="formController()">
              <h2 class="font-bold text-[1.75rem]">
                Enter your details to complete asset addition
              </h2>
              <div class="mt-5 mb-8 flex flex-col gap-y-5">
                <!-- DROPDOWN: ASSET TYPE -->
                <div
                  x-data="dropdown({
                    label: 'Type of Asset',
                    placeholder: 'Select Type of Asset',
                    options: ['Fintech Business', 'Real Estate', 'Cryptocurrency', 'Software Licenses', 'Trademarks'],
                    onSelect: value => formData.assetType = value
                  })"
                  class="relative"
                >
                  <label
                    class="block text-sm text-gray-800 mb-2"
                    x-text="label"
                  ></label>

                  <div
                    x-on:click="toggle"
                    class="cursor-pointer rounded-[50px] text-sm flex justify-between items-center w-full px-4 h-12 border-[1.5px] border-gray-200 text-gray-500"
                    :class="{'bg-gray-100 text-gray-800' : isSelected()}"
                  >
                    <span x-text="selected || placeholder"></span>
                    <img
                      src="chevron-down.svg"
                      alt=""
                      :class="{'transform rotate-180': open}"
                      class="transition-transform duration-300"
                    />
                  </div>

                  <!-- ASSET TYPE LIST -->
                  <div
                    x-show="open"
                    x-on:click.away="open = false"
                    class="absolute w-full mt-1 bg-white border-[1.5px] border-gray-300 rounded-md shadow-lg z-10"
                  >
                    <ul>
                      <template x-for="option in options" :key="option">
                        <li
                          x-on:click="select(option)"
                          class="px-4 py-2 cursor-pointer text-sm hover:bg-gray-100"
                          x-text="option"
                        ></li>
                      </template>
                    </ul>
                  </div>
                </div>

                <!-- DROPDOWN: COUNTRY -->
                <div
                  x-data="dropdown({
                    label: 'Country',
                    placeholder: 'Select Country',
                    options: ['Albania', 'Brazil', 'China', 'Denmark', 'United States'],
                    onSelect: value => formData.country = value
                  })"
                  class="relative"
                >
                  <label
                    class="block text-sm text-gray-800 mb-2"
                    x-text="label"
                  ></label>

                  <div
                    x-on:click="toggle"
                    class="cursor-pointer rounded-[50px] text-sm flex justify-between items-center w-full px-4 h-12 border-[1.5px] border-gray-200 text-gray-500"
                    :class="{'bg-gray-100 text-gray-800' : isSelected()}"
                  >
                    <span x-text="selected || placeholder"></span>
                    <img
                      src="chevron-down.svg"
                      alt=""
                      :class="{'transform rotate-180': open}"
                      class="transition-transform duration-300"
                    />
                  </div>

                  <!-- COUNTRY LIST -->
                  <div
                    x-show="open"
                    x-on:click.away="open = false"
                    class="absolute w-full mt-1 bg-white border-[1.5px] border-gray-300 rounded-md shadow-lg z-10"
                  >
                    <ul>
                      <template x-for="option in options" :key="option">
                        <li
                          x-on:click="select(option)"
                          class="px-4 py-2 cursor-pointer text-sm hover:bg-gray-100"
                          x-text="option"
                        ></li>
                      </template>
                    </ul>
                  </div>
                </div>

                <!-- DROPDOWN: LICENSE TYPE -->
                <div
                  x-data="dropdown({
                    label: 'Type of License',
                    placeholder: 'Select Type',
                    options: ['Asset Management', 'Payment Processing', 'E-Money Institution', 'Credit License', 'Gaming'],
                    onSelect: value => formData.licenseType = value
                  })"
                  class="relative"
                >
                  <label
                    class="block text-sm text-gray-800 mb-2"
                    x-text="label"
                  ></label>

                  <div
                    x-on:click="toggle"
                    class="cursor-pointer rounded-[50px] text-sm flex justify-between items-center w-full px-4 h-12 border-[1.5px] border-gray-200 text-gray-500"
                    :class="{'bg-gray-100 text-gray-800' : isSelected()}"
                  >
                    <span x-text="selected || placeholder"></span>
                    <img
                      src="chevron-down.svg"
                      alt=""
                      :class="{'transform rotate-180': open}"
                      class="transition-transform duration-300"
                    />
                  </div>

                  <!-- LICENSE TYPE LIST -->
                  <div
                    x-show="open"
                    x-on:click.away="open = false"
                    class="absolute w-full mt-1 bg-white border-[1.5px] border-gray-300 rounded-md shadow-lg z-10"
                  >
                    <ul>
                      <template x-for="option in options" :key="option">
                        <li
                          x-on:click="select(option)"
                          class="px-4 py-2 cursor-pointer text-sm hover:bg-gray-100"
                          x-text="option"
                        ></li>
                      </template>
                    </ul>
                  </div>
                </div>

                <!-- DROPDOWN: BUSINESS TYPE -->
                <div
                  x-data="dropdown({
                    label: 'Type of Business',
                    placeholder: 'Select Business',
                    options: ['Enterprise', 'Franchise', 'Non-Profit Organization', 'Startup', 'Small Business'],
                    onSelect: value => formData.businessType = value
                  })"
                  class="relative"
                >
                  <label
                    class="block text-sm text-gray-800 mb-2"
                    x-text="label"
                  ></label>

                  <div
                    x-on:click="toggle"
                    class="cursor-pointer rounded-[50px] text-sm flex justify-between items-center w-full px-4 h-12 border-[1.5px] border-gray-200 text-gray-500"
                    :class="{'bg-gray-100 text-gray-800' : isSelected()}"
                  >
                    <span x-text="selected || placeholder"></span>
                    <img
                      src="chevron-down.svg"
                      alt=""
                      :class="{'transform rotate-180': open}"
                      class="transition-transform duration-300"
                    />
                  </div>

                  <!-- BUSINESS TYPE LIST -->
                  <div
                    x-show="open"
                    x-on:click.away="open = false"
                    class="absolute w-full mt-1 bg-white border-[1.5px] border-gray-300 rounded-md shadow-lg z-10"
                  >
                    <ul>
                      <template x-for="option in options" :key="option">
                        <li
                          x-on:click="select(option)"
                          class="px-4 py-2 cursor-pointer text-sm hover:bg-gray-100"
                          x-text="option"
                        ></li>
                      </template>
                    </ul>
                  </div>
                </div>

                <!-- SELECTOR: BUSINESS STATUS -->
                <div
                  x-data="selector({
                  label: 'Business Status',
                  options: ['Active', 'Not Active'],
                  onSelect: value => formData.businessStatus = value
                })"
                  class="space-y-2"
                >
                  <label
                    class="block text-sm text-gray-800"
                    x-text="label"
                  ></label>

                  <!-- BUSINESS STATUS LIST -->
                  <div class="flex flex-col md:flex-row gap-5">
                    <template x-for="option in options" :key="option">
                      <div
                        @click="select(option)"
                        class="h-12 px-4 py-3 border-[1.5px] cursor-pointer flex items-center rounded-[50px] text-sm w-full text-gray-600"
                        :class="{
                          'bg-gray-200 border-blue-500': selected === option,
                          'bg-white border-gray-300': selected !== option
                        }"
                      >
                        <div class="flex w-full justify-between">
                          <div class="flex gap-2 items-center">
                            <template x-if="selected === option">
                              <div
                                class="w-6 h-6 relative rounded-full border-2 border-blue-500"
                              >
                                <div
                                  class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-blue-500"
                                ></div>
                              </div>
                            </template>
                            <template x-if="selected !== option">
                              <div
                                class="w-6 h-6 rounded-full border-2 border-gray-300"
                              ></div>
                            </template>
                            <span
                              x-text="option"
                              class="font-medium text-gray-900"
                            ></span>
                          </div>
                          <template x-if="selected === option">
                            <img
                              @click.stop="clear()"
                              class="text-blue-500 font-bold"
                              src="cross.svg"
                            />
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- NUMBER INPUT: EMPLOYEE COUNT -->
                <div
                  x-data="numberInput({ label: 'Employee Count', placeholder: 'Enter the quantity', onSelect: value => formData.employeeCount = value })"
                >
                  <label
                    class="block text-sm text-gray-800 mb-2"
                    x-text="label"
                  ></label>

                  <div class="relative">
                    <input
                      type="text"
                      x-model="value"
                      placeholder="Enter the quantity"
                      class="rounded-[50px] text-sm flex justify-between items-center w-full px-4 h-12 border-[1.5px] border-gray-200 text-gray-500"
                      :class="{'bg-gray-100 text-gray-800' : value !== ''}"
                      @input="onInput"
                    />
                    <img
                      src="eye.svg"
                      alt=""
                      class="cursor-pointer absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400"
                      x-show="isFilled()"
                    />
                  </div>
                </div>

                <!-- DROPDOWN: LICENSE YEAR -->
                <div
                  x-data="dropdown({
                    label: 'Year of License Issue',
                    placeholder: 'Select the Year',
                    options: ['2025', '2024', '2023', '2022', '2021'],
                    onSelect: value => formData.licenseYear = value
                  })"
                  class="relative"
                >
                  <label
                    class="block text-sm text-gray-800 mb-2"
                    x-text="label"
                  ></label>

                  <div
                    x-on:click="toggle"
                    class="cursor-pointer rounded-[50px] text-sm flex justify-between items-center w-full px-4 h-12 border-[1.5px] border-gray-200 text-gray-500"
                    :class="{'bg-gray-100 text-gray-800' : isSelected()}"
                  >
                    <span x-text="selected || placeholder"></span>
                    <img
                      src="chevron-down.svg"
                      alt=""
                      :class="{'transform rotate-180': open}"
                      class="transition-transform duration-300"
                    />
                  </div>

                  <!-- LICENSE YEAR LIST -->
                  <div
                    x-show="open"
                    x-on:click.away="open = false"
                    class="absolute w-full mt-1 bg-white border-[1.5px] border-gray-300 rounded-md shadow-lg z-10"
                  >
                    <ul>
                      <template x-for="option in options" :key="option">
                        <li
                          x-on:click="select(option)"
                          class="px-4 py-2 cursor-pointer text-sm hover:bg-gray-100"
                          x-text="option"
                        ></li>
                      </template>
                    </ul>
                  </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-5 w-full">
                  <!-- MONEY INPUT: LAST YEAR REVENUE -->
                  <div
                    x-data="moneyInput({ label: 'Last Year Revenue', placeholder: 'Enter Amount', onSelect: value => formData.lastYearRevenue = value })"
                  >
                    <label
                      class="block text-sm text-gray-800 mb-1"
                      x-text="label"
                    ></label>
                    <input
                      type="text"
                      class="rounded-[50px] w-full text-sm px-4 h-12 border-[1.5px] border-gray-200 text-gray-800"
                      :class="{'border-red-400': isFilled()}"
                      x-model="input"
                      @input="formatInput"
                      :placeholder="placeholder"
                    />
                  </div>

                  <!-- MONEY INPUT: LAST YEAR EXPENSES -->
                  <div
                    x-data="moneyInput({ label: 'Last Year Expenses', placeholder: 'Enter Amount', onSelect: value => formData.lastYearExpenses = value })"
                  >
                    <label
                      class="block text-sm text-gray-800 mb-1"
                      x-text="label"
                    ></label>
                    <input
                      type="text"
                      class="rounded-[50px] w-full text-sm px-4 h-12 border-[1.5px] border-gray-200 text-gray-800"
                      :class="{'border-red-400': isFilled()}"
                      x-model="input"
                      @input="formatInput"
                      :placeholder="placeholder"
                    />
                  </div>
                </div>
              </div>

              <!-- FORM SUBMIT BUTTON -->
              <div>
                <button
                  class="rounded-4xl h-12 w-full flex justify-center items-center gap-x-2"
                  :class="[
                    (!isFilled()) ? 'bg-gray-200 text-gray-500 cursor-not-allowed' :
                      isProcessing ? 'bg-blue-500 text-white cursor-not-allowed' :
                      'bg-blue-500 text-white cursor-pointer'
                  ]"
                  :disabled="!isFilled() || isProcessing"
                  @click="submit"
                >
                  <template x-if="!isProcessing">
                    <span class="font-medium">Continue</span>
                  </template>

                  <!-- BUTTON PROCESSING STATE -->
                  <template x-if="isProcessing">
                    <span class="font-medium flex items-center gap-2">
                      Processing...
                      <svg
                        class="mr-3 -ml-1 size-4 animate-spin text-white"
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                      >
                        <circle
                          class="opacity-25"
                          cx="12"
                          cy="12"
                          r="10"
                          stroke="currentColor"
                          stroke-width="4"
                        ></circle>
                        <path
                          class="opacity-75"
                          fill="currentColor"
                          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                        ></path>
                      </svg>
                    </span>
                  </template>
                  <img
                    :class="{'brightness-0 invert': isFilled() && !isProcessing, 'hidden': isProcessing}"
                    src="chevron-right.svg"
                    alt=""
                  />
                </button>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
